status:
  scope: >-
    The reference release at 6a7eebe7311a0bd52c1e59c0b1b7150c7bee6137
    records 384 proof modules and coverage of 80 manuscript claims. These are
    historical checks with Lean v4.33.0-rc1, not verification of a later port or
    an independent Palomar Challenge. The requested submission concerns the full
    stochastic controllability classification, not only an algebraic lemma.
  sorry_count: 10
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: agent
      framework: OpenAI Codex
      tool_setup: >-
        AI-assisted proof development and distinct AI statement reviews are
        disclosed in docs/FORMALIZATION.md and formalization/audit. This
        preparation also uses Codex for repository, toolchain, and interface work.
  notes: >-
    Historical model identities, costs, and prompt logs are not reconstructed.
    Human authors retain responsibility. Automated review is not human peer review.

fidelity:
  divergences: >-
    The claim mapping concerns the revised manuscript, including its five
    disclosed revisions. Controls are ordinary progressive finite-energy
    processes and states are actual continuous square-integrable paths on the
    usual augmented joint Brownian filtration. Positive state and noise
    dimensions and a positive horizon are required. Exact-arithmetic
    factorization results do not certify floating-point numerical software.
    PalomarBridge proves correspondence with the original raw SDE predicates.
    The scalar Ito maps are characterized by their values on every bounded
    predictable step process; classification proves existence and ito_unique
    proves uniqueness. The sorry count includes two intentional Challenge
    theorem holes and eight inherited holes in the vendored stochastic
    dependency closure. There are no definition holes or new solution holes.
    Source occurrence counts do not establish whether a theorem depends on a
    hole; transitive axiom inspection is recorded separately in
    formalization/palomar/local-check.json and the official preflight report.

review:
  status: agent-reviewed
  notes: >-
    This status describes the reference release's disclosed AI statement review.
    The port and new interface were also prepared and checked by Codex, with
    no claim of independent human review. Historical kernel replay used Lean's
    own leanchecker. Current local check evidence and the status of sandboxed
    Comparator, NanoDa, and con-ron appear in docs/PALOMAR.md; none is an
    editorial acceptance or registration. See also docs/FORMALIZATION.md and
    formalization/audit.

alignment:
  namespace: LinearStochastic
  statements:
    - source: Main controllability classification of the accompanying manuscript
      lean: LinearStochastic.Palomar.classification
      module: Solution
      status: proved
      note: >-
        Independent Mathlib-only statement in Challenge.lean, proved in
        Solution.lean through PalomarBridge and RawCompleteClassification.
        The result includes existence of the specified Ito integral maps.
    - source: Uniqueness of the L2 Ito integral from bounded predictable step processes
      lean: LinearStochastic.Palomar.ito_unique
      module: Solution
      status: proved
      note: Prevents the integral witnesses in the classification from changing its meaning.
