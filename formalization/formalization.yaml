# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: v0.4

project:
  name: A Unified Kalman-Type Classification of Controllability for Linear Stochastic Systems
  description: >-
    Formalization of a finite algebraic classification of approximate,
    approximate null, exact null, and exact controllability for finite-dimensional
    linear stochastic systems with constant coefficients and independent
    Brownian drivers. A decreasing subspace sequence gives a common obstruction
    for the first three properties; exact controllability additionally requires
    full row rank of the stacked diffusion-control matrix. The development also
    covers stochastic integration, forward and backward equations, duality,
    finite rank tests, null feedback, and polynomial small-time energy bounds.
    The independent Palomar statement and its solution compile with Lean
    v4.35.0-rc2 and canonical Mathlib. Complete sandboxed mechanical preflight
    and editorial review are separate requirements; no registration is claimed.
  authors:
    - Yu Wang
  responsible_maintainers:
    - Yu Wang
  license: Apache-2.0

classification:
  arxiv: [math.OC, math.PR]
  msc2020: [93B05, 93E03, 60H10, 68V20]

sources:
  - title: A Unified Kalman-Type Classification of Controllability for Linear Stochastic Systems
    authors: [Qi Lü, Yu Wang]
    type: manuscript
    relationship: formalizes
    location: https://github.com/MrGodfrey/LeanForCriteriaForLinearStochastic/blob/6a7eebe7311a0bd52c1e59c0b1b7150c7bee6137/main.pdf
    note: >-
      The revised manuscript is included as main.tex and main.pdf. Its source
      SHA-256 is 8ccc417fa3629e23e0b9dba2cd499916ccc9369201a9bec28f1538d298cb39ea.
      Five disclosed proof or scope revisions are described in
      docs/FORMALIZATION.md. Paper authorship and formalization authorship are
      recorded separately.

