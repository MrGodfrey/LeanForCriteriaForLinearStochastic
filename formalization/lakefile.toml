name = "LinearStochastic"
version = "0.1.0"
defaultTargets = ["LinearStochastic", "Challenge", "Solution"]

[leanOptions]
autoImplicit = false

[[require]]
name = "stochastic_dependencies"
path = "vendor/stochastic"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "065356127b1dc0016f66b7283ce0ce2c4055aa55"

[[lean_lib]]
name = "LinearStochastic"

[[lean_lib]]
name = "PalomarDefinitions"
roots = ["PalomarDefinitions"]

[[lean_lib]]
name = "PalomarBridge"
roots = ["PalomarBridge"]

[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]

[[lean_lib]]
name = "Solution"
roots = ["Solution"]
